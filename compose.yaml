name: app-karhutla-fostifest

x-common: &common
  restart: unless-stopped
  cpu_shares: 256
  pids_limit: 256
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  postgres:
    <<: *common
    image: postgres:17-alpine
    cpus: 1
    mem_limit: 1536m
    mem_reservation: 256m
    memswap_limit: 1536m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: [postgres, -c, shared_buffers=256MB, -c, effective_cache_size=1GB, -c, work_mem=8MB, -c, max_connections=60]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    <<: *common
    build: ./services/api
    cpus: 2
    mem_limit: 1536m
    mem_reservation: 256m
    memswap_limit: 1536m
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes: ['./data:/data', './assets/videos:/videos:ro']
    networks:
      internal: {}
      proxy:
        aliases: [karhutla-fostifest-backend]
    depends_on:
      postgres: {condition: service_healthy}
    command: [sh, -c, 'alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips=*']
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  vision:
    <<: *common
    build: ./services/vision
    cpus: 8
    mem_limit: 4g
    mem_reservation: 1g
    memswap_limit: 4g
    env_file: .env
    environment:
      API_URL: http://backend:8000
      DATA_DIR: /data
    volumes: ['./data:/data', './assets/models:/models:ro', './assets/videos:/videos:ro']
    networks: [internal]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'from pathlib import Path; import time; p=Path("/data/worker-heartbeat"); assert p.exists() and time.time()-p.stat().st_mtime<30']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
  frontend:
    <<: *common
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    cpus: 1
    mem_limit: 1g
    mem_reservation: 256m
    memswap_limit: 1g
    networks:
      proxy:
        aliases: [karhutla-fostifest-web]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:3000").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
networks:
  internal:
    internal: true
  proxy:
    external: true
